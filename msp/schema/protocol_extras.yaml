version: 1
description: Content of INAV msp_protocol*.h that is not a message code, carried verbatim so the generated
  headers are drop-in replacements. Everything else in those headers comes from msp_v2.yaml.
headers:
  v1:
    license: "/*\n * This file is part of Cleanflight.\n *\n * Cleanflight is free software: you can redistribute\
