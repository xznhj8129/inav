      \ version.\n *\n * Cleanflight is distributed in the hope that it will be useful,\n * but WITHOUT\
      \ ANY WARRANTY; without even the implied warranty of\n * MERCHANTABILITY or FITNESS FOR A PARTICULAR\
      \ PURPOSE.  See the\n * GNU General Public License for more details.\n *\n * You should have received\
      \ a copy of the GNU General Public License\n * along with Cleanflight.  If not, see <http://www.gnu.org/licenses/>.\n\
      \ */"
    preamble: "/**\n * MSP Guidelines, emphasis is used to clarify.\n *\n * Each FlightController (FC,\
      \ Server) MUST change the API version when any MSP command is added, deleted, or changed.\n *\n\
      \ * If you fork the FC source code and release your own version, you MUST change the Flight Controller\
      \ Identifier.\n *\n * NEVER release a modified copy of this code that shares the same Flight controller\
      \ IDENT and API version\n * if the API doesn't match EXACTLY.\n *\n * Consumers of the API (API\
      \ clients) SHOULD first attempt to get a response from the MSP_API_VERSION command.\n *\n * API\
      \ consumers should ALWAYS handle communication failures gracefully and attempt to continue\n * without\
      \ the information if possible.  Clients MAY log/display a suitable message.\n *\n * API clients\
      \ should NOT attempt any communication if they can't handle the returned API MAJOR VERSION.\n *\n\
      \ * API clients SHOULD attempt communication if the API MINOR VERSION has increased from the time\n\
      \ * the API client was written and handle command failures gracefully.  Clients MAY disable\n *\
      \ functionality that depends on the commands while still leaving other functionality intact.\n *\
      \ Clients SHOULD operate in READ-ONLY mode and SHOULD present a warning to the user to state\n *\
      \ that the newer API version may cause problems before using API commands that change FC state.\n\
      \ *\n * It is for this reason that each MSP command should be specific as possible, such that changes\n\
      \ * to commands break as little functionality as possible.\n *\n * API client authors MAY use a\
      \ compatibility matrix/table when determining if they can support\n * a given command from a given\
      \ flight controller at a given api version level.\n *\n * Developers MUST NOT create new MSP commands\
      \ that do more than one thing.\n *\n * Failure to follow these guidelines will likely invoke the\
      \ wrath of developers trying to write tools\n * that use the API and the users of those tools.\n\
      \ */\n/* Protocol numbers used both by the wire format, config system, and\n   field setters.\n\
      */\n#define MSP_PROTOCOL_VERSION                0   // Same version over MSPv1 & MSPv2 - message\
      \ format didn't change and it backward compatible\n#define API_VERSION_MAJOR                   2\
      \   // increment when major changes are made\n#define API_VERSION_MINOR                   6   //\
      \ increment when any change is made, reset to zero when major changes are released after changing\
      \ API_VERSION_MAJOR\n#define API_VERSION_LENGTH                  2\n#define MULTIWII_IDENTIFIER\
      \ \"MWII\";\n#define BASEFLIGHT_IDENTIFIER \"BAFL\";\n#define BETAFLIGHT_IDENTIFIER \"BTFL\"\n#define\
      \ CLEANFLIGHT_IDENTIFIER \"CLFL\"\n#define INAV_IDENTIFIER \"INAV\"\n#define RACEFLIGHT_IDENTIFIER\
      \ \"RCFL\"\n#define FLIGHT_CONTROLLER_IDENTIFIER_LENGTH 4\n#define FLIGHT_CONTROLLER_VERSION_LENGTH\
      \    3\n#define FLIGHT_CONTROLLER_VERSION_MASK      0xFFF\n#define BOARD_IDENTIFIER_LENGTH     \
      \        4 // 4 UPPER CASE alpha numeric characters that identify the board being used.\n#define\
      \ BOARD_HARDWARE_REVISION_LENGTH      2\n// These are baseflight specific flags but they are useless\
      \ now since MW 2.3 uses the upper 4 bits for the navigation version.\n#define CAP_PLATFORM_32BIT\
      \          ((uint32_t)1 << 31)\n#define CAP_BASEFLIGHT_CONFIG       ((uint32_t)1 << 30)\n// MW 2.3\
      \ stores NAVI_VERSION in the top 4 bits of the capability mask.\n#define CAP_NAVI_VERSION_BIT_4_MSB\
      \  ((uint32_t)1 << 31)\n#define CAP_NAVI_VERSION_BIT_3      ((uint32_t)1 << 30)\n#define CAP_NAVI_VERSION_BIT_2\
      \      ((uint32_t)1 << 29)\n#define CAP_NAVI_VERSION_BIT_1_LSB  ((uint32_t)1 << 28)\n#define CAP_DYNBALANCE\
      \              ((uint32_t)1 << 2)\n#define CAP_FLAPS                   ((uint32_t)1 << 3)\n#define\
      \ CAP_NAVCAP                  ((uint32_t)1 << 4)\n#define CAP_EXTAUX                  ((uint32_t)1\
      \ << 5)\n//\n// MSP commands for Cleanflight original features\n//\n// private - only to be used\
      \ by the configurator, the commands are likely to change\n//\n// Baseflight MSP commands (if enabled\
      \ they exist in Cleanflight)\n//\n// Betaflight Additional Commands\n//\n// OSD specific\n//\n//\n\
      // Multwii original MSP commands\n//\n// #define MSP_BIND                 240    //in message  \
      \        no param\n// #define MSP_ALARMS               242\n// Additional commands that are not\
      \ compatible with MultiWii\n// MSPv2 includes"
